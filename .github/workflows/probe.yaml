name: Probe

# Temporary: exercises the find-patch / workflow_run commit split. Removed after the test.
on:
  pull_request:

permissions: {}

jobs:
  make:
    name: Make Patch
    if: github.head_ref != 'probe-skip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Generate
        run: printf 'generated\n' > probe.txt
      - name: Create Patch
        uses: TimSchoenle/actions/actions/common/create-patch@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-create-patch-v1.1.1
        with:
          artifact_name: probe-patch
          paths: probe.txt
